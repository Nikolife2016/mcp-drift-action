# Действие проверяет само себя ежедневно: если оно перестанет работать, мы узнаем об этом
# раньше, чем те, кто его поставил.
name: self-check
on:
  schedule: [{ cron: "0 6 * * *" }]
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --test "test/*.test.mjs"
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          packages: "@modelcontextprotocol/server-filesystem,mcp-remote,@upstash/context7-mcp"
          fail-on: never
